patterns:
  # ─── AWS / Google / Azure (Tus reglas actuales están bien, las mantenemos) ───
  # ... (mantén las anteriores aquí) ...

  # ─── NUEVO: Plataformas Modernas ─────────────────────────────────────
  - name: "Stripe Secret Key"
    pattern: "(?i)sk_(?:test|live)_[0-9a-zA-Z]{24,}"
    severity: critical
    description: "Clave secreta de Stripe (Compromiso financiero)"

  - name: "Stripe Restricted/Public Key"
    pattern: "(?i)(?:pk|rk)_(?:test|live)_[0-9a-zA-Z]{24,}"
    severity: medium
    description: "Clave de Stripe (Revisar permisos)"

  - name: "GitHub Personal Access Token"
    pattern: "gh[pso]_[a-zA-Z0-9]{36}"
    severity: critical
    description: "GitHub API Token"

  - name: "Mailgun API Key"
    pattern: "key-[0-9a-zA-Z]{32}"
    severity: high
    description: "Permite enviar correos suplantando el dominio"

  # ─── MEJORADO: Patrones Genéricos (Menos Falsos Positivos) ───────────
  - name: "Generic API Key"
    pattern: "(?i)\\b(?:api[_-]?key|apikey|api[_-]?secret)\\b[\"'\\s]*[:=][\"'\\s]*([A-Za-z0-9_\\-]{16,40})[\"']"
    severity: medium
    description: "Asignación genérica de API Key (Delimitada)"

  - name: "Generic Password"
    pattern: "(?i)\\b(?:password|passwd|pwd)\\b[\"'\\s]*[:=][\"'\\s]*([A-Za-z0-9_\\-@!#$%^&*]{8,32})[\"']"
    severity: medium
    description: "Contraseña hardcodeada (Delimitada)"

# ─── MEJORADO: Entropía Inteligente ───────────────────────────────────────────
entropy:
  enabled: true
  min_length: 16
  max_length: 256
  shannon_threshold: 4.5
  hex_threshold: 3.5
  skip_patterns:
    - "^[a-fA-F0-9]{32}$"                                           # MD5 hashes
    - "^[a-fA-F0-9]{40}$"                                           # SHA1 hashes
    - "^[a-fA-F0-9]{64}$"                                           # SHA256 hashes
    - "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" # UUIDs (CRÍTICO SILENCIARLOS)
    - "^[01]+$"                                                     # Cadenas Binarias
    - "^[A-Z0-9_]+$"                                                # CONSTANTES UPPERCASE
