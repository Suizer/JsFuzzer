# Sink patterns for vulnerability identification
# Each sink has a name, patterns to match, severity, and category

sinks:
  # ─── DOM XSS (HTML Injection) ──────────────────────────────────────
  - name: "innerHTML assignment"
    patterns:
      - "\\.innerHTML\\s*="
      - "\\.innerHTML\\s*\\+="
    severity: high
    category: dom_xss
    description: "Direct HTML injection into DOM element"

  - name: "outerHTML assignment"
    patterns:
      - "\\.outerHTML\\s*="
    severity: high
    category: dom_xss
    description: "Replaces entire element including itself"

  - name: "document.write"
    patterns:
      - "document\\.write\\s*\\("
      - "document\\.writeln\\s*\\("
    severity: high
    category: dom_xss
    description: "Writes raw HTML to document stream"

  - name: "insertAdjacentHTML"
    patterns:
      - "\\.insertAdjacentHTML\\s*\\("
    severity: high
    category: dom_xss
    description: "Inserts HTML at specified position"

  # ─── Code Execution ────────────────────────────────────────────────
  - name: "eval()"
    patterns:
      - "\\beval\\s*\\("
    severity: critical
    category: execution
    description: "Executes arbitrary JavaScript string"

  - name: "Function constructor"
    patterns:
      - "new\\s+Function\\s*\\("
      - "(?<!is|\\.)Function\\s*\\(\\s*[\"'`]"
    severity: critical
    category: execution
    description: "Dynamic function creation from string"

  - name: "setTimeout with string"
    patterns:
      - "setTimeout\\s*\\(\\s*[\"'`]"
    severity: medium
    category: execution
    description: "setTimeout with string argument (acts as eval)"

  - name: "setInterval with string"
    patterns:
      - "setInterval\\s*\\(\\s*[\"'`]"
    severity: medium
    category: execution
    description: "setInterval with string argument (acts as eval)"

  # ─── Navigation / Open Redirect ────────────────────────────────────
  - name: "location.href assignment"
    patterns:
      - "location\\.href\\s*="
      - "window\\.location\\s*="
      - "document\\.location\\s*="
    severity: medium
    category: navigation
    description: "URL navigation — potential open redirect"

  - name: "location.replace"
    patterns:
      - "location\\.replace\\s*\\("
    severity: medium
    category: navigation
    description: "URL replacement without history entry"

  - name: "window.open"
    patterns:
      - "window\\.open\\s*\\("
    severity: low
    category: navigation
    description: "Opens new window/tab"

  # ─── Cross-Origin Communication ────────────────────────────────────
  - name: "postMessage"
    patterns:
      - "\\.postMessage\\s*\\("
    severity: medium
    category: communication
    description: "Cross-origin message sending"

  - name: "postMessage listener"
    patterns:
      - "addEventListener\\s*\\(\\s*[\"']message[\"']"
      - "onmessage\\s*="
    severity: high
    category: communication
    description: "Message event listener — check origin validation"

  # ─── Storage Access ────────────────────────────────────────────────
  - name: "localStorage"
    patterns:
      - "localStorage\\."
      - "localStorage\\["
    severity: low
    category: storage
    description: "Client-side persistent storage access"

  - name: "sessionStorage"
    patterns:
      - "sessionStorage\\."
      - "sessionStorage\\["
    severity: low
    category: storage
    description: "Client-side session storage access"

  - name: "document.cookie"
    patterns:
      - "document\\.cookie"
    severity: medium
    category: storage
    description: "Cookie access — check httpOnly flags"

# ─── Context lines to display around findings ────────────────────────────────
context_lines: 2
